language: pt_PT
debug: false
economy:
  mode: auto
  priority: ["MultiBank", "Vault"]
faction:
  # Cost to create a faction
  creation-cost: 100.0
  # Max tag length
  max-tag-length: 4
  # Max faction name length
  max-name-length: 24
  # Min faction name length
  min-name-length: 3
  # Invite expiry time in hours
  invite-expiry-hours: 24
  # Default member limit (0 = unlimited)
  default-member-limit: 0
  # Default member limit toggle (false = unlimited by default)
  default-member-limit-enabled: false
  # Max member limit that can be set
  absolute-max-members: 50
  # Default visibility for new factions
  default-public: false
  # Friendly fire always enabled
  friendly-fire: true
# Default roles created for new factions
default-roles:
  - name: "Officer"
    priority: 1
    can-invite: true
    can-kick: true
    can-edit-settings: false
    can-manage-roles: false
    can-promote: true
    can-demote: true
    can-access-bank: true
  - name: "Member"
    priority: 2
    can-invite: true
    can-kick: false
    can-edit-settings: false
    can-manage-roles: false
    can-promote: false
    can-demote: false
    can-access-bank: false
  - name: "Recruit"
    priority: 3
    can-invite: false
    can-kick: false
    can-edit-settings: false
    can-manage-roles: false
    can-promote: false
    can-demote: false
    can-access-bank: false
multibank:
  # Auto-create faction bank account
  auto-create-bank: true
  # Bank account name prefix
  bank-name-prefix: "Faction: "
sounds:
  faction-created: "minecraft:entity.experience_orb.pickup"
  member-joined: "minecraft:entity.player.levelup"
  member-left: "minecraft:entity.villager.no"
  member-kicked: "minecraft:entity.iron_golem.hurt"
  faction-dissolved: "minecraft:entity.wither.death"
  invite-received: "minecraft:entity.experience_orb.pickup"
  role-changed: "minecraft:block.anvil.use"
  settings-saved: "minecraft:ui.button.click"

# ==========================================================================
# GUI Layout Configuration
# Adjust inventory sizes and slot positions for every GUI.
# Sizes must be multiples of 9 (9, 18, 27, 36, 45, 54).
# ==========================================================================
gui:
  main-menu-no-faction:
    size: 9
    slots:
      create: 1
      browse-public: 3
      invites: 5
      close: 7

  main-menu-faction:
    size: 27
    slots:
      faction-info: 0
      members: 2
      chat-toggle: 4
      browse-public: 6
      invites: 8
      roles: 9
      settings: 11
      leave: 18
      close: 22
      dissolve: 26

  settings:
    size: 18
    slots:
      name: 0
      tag: 2
      primary-color: 4
      secondary-color: 6
      visibility: 8
      member-limit: 9
      transfer-leadership: 11
      back: 13
      close: 17

  role-editor:
    size: 18
    slots:
      role-name: 0
      priority-down: 2
      priority-display: 3
      priority-up: 4
      delete: 8
      perm-invite: 9
      perm-kick: 10
      perm-settings: 11
      perm-roles: 12
      perm-promote: 13
      perm-demote: 14
      perm-bank: 15
      back: 16
      save: 17

  members:
