prefix: "<dark_gray>[<gradient:#4CAF50:#2E7D32>Facções</gradient>]</dark_gray>"

# Criação
faction-created: "{prefix} <green>Facção <white>{name}</white> [<white>{tag}</white>] criada!</green>"
faction-created-broadcast: "{prefix} <yellow><white>{player}</white> criou a facção <white>{name}</white> [<white>{tag}</white>]!</yellow>"
faction-create-cost: "{prefix} <gray>Criar uma facção custa <white>{cost}</white>.</gray>"
faction-not-enough-money: "{prefix} <red>Precisas de <white>{cost}</white> mas tens <white>{balance}</white>.</red>"
faction-name-taken: "{prefix} <red>Esse nome de facção já está em uso.</red>"
faction-tag-taken: "{prefix} <red>Essa tag já está em uso.</red>"
faction-name-too-long: "{prefix} <red>O nome deve ter entre {min} e {max} caracteres.</red>"
faction-tag-too-long: "{prefix} <red>A tag deve ter entre 1 e {max} caracteres.</red>"
faction-name-invalid: "{prefix} <red>O nome contém caracteres inválidos.</red>"
faction-already-in-faction: "{prefix} <red>Já estás numa facção. Sai primeiro.</red>"

# Dissolução
faction-dissolved: "{prefix} <red>A facção <white>{name}</white> foi dissolvida.</red>"
