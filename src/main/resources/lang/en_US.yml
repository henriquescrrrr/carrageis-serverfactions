prefix: "<dark_gray>[<gradient:#4CAF50:#2E7D32>Factions</gradient>]</dark_gray>"

# Creation
faction-created: "{prefix} <green>Faction <white>{name}</white> [<white>{tag}</white>] created!</green>"
faction-created-broadcast: "{prefix} <yellow><white>{player}</white> created the faction <white>{name}</white> [<white>{tag}</white>]!</yellow>"
faction-create-cost: "{prefix} <gray>Creating a faction costs <white>{cost}</white>.</gray>"
faction-not-enough-money: "{prefix} <red>You need <white>{cost}</white> but have <white>{balance}</white>.</red>"
faction-name-taken: "{prefix} <red>That faction name is already taken.</red>"
faction-tag-taken: "{prefix} <red>That tag is already taken.</red>"
faction-name-too-long: "{prefix} <red>Name must be {min}-{max} characters.</red>"
faction-tag-too-long: "{prefix} <red>Tag must be 1-{max} characters.</red>"
faction-name-invalid: "{prefix} <red>Name contains invalid characters.</red>"
faction-already-in-faction: "{prefix} <red>You're already in a faction. Leave first.</red>"

# Dissolution
faction-dissolved: "{prefix} <red>Faction <white>{name}</white> has been dissolved.</red>"
faction-dissolved-member: "{prefix} <red>Your faction <white>{name}</white> was dissolved by the leader.</red>"
faction-only-leader-dissolve: "{prefix} <red>Only the leader can dissolve the faction.</red>"

# Join/Leave
faction-joined: "{prefix} <green>You joined <white>{name}</white>!</green>"
faction-joined-broadcast: "{prefix} <yellow><white>{player}</white> joined the faction!</yellow>"
faction-left: "{prefix} <gray>You left <white>{name}</white>.</gray>"
faction-left-broadcast: "{prefix} <yellow><white>{player}</white> left the faction.</yellow>"
faction-leader-cannot-leave: "{prefix} <red>You're the leader. Transfer leadership first or dissolve the faction.</red>"
faction-not-in-faction: "{prefix} <red>You're not in a faction.</red>"

# Invites
faction-invite-sent: "{prefix} <green>Invited <white>{player}</white> to the faction.</green>"
faction-invite-received: "{prefix} <yellow><white>{player}</white> invited you to <white>{faction}</white>! <click:run_command:/fac invites><gold>[View Invites]</gold></click></yellow>"
faction-invite-accepted: "{prefix} <green>You accepted the invite to <white>{faction}</white>.</green>"
faction-invite-declined: "{prefix} <gray>You declined the invite from <white>{faction}</white>.</gray>"
faction-invite-expired: "{prefix} <gray>Invite from <white>{faction}</white> expired.</gray>"
faction-invite-already-sent: "{prefix} <red>That player already has a pending invite.</red>"
faction-invite-self: "{prefix} <red>You can't invite yourself.</red>"
faction-target-in-faction: "{prefix} <red><white>{player}</white> is already in a faction.</red>"
faction-full: "{prefix} <red>Faction is full ({count}/{max}).</red>"
faction-no-permission-invite: "{prefix} <red>Your role doesn't have invite permission.</red>"
faction-faction-private: "{prefix} <red>This faction is private. You need an invite.</red>"
faction-joined-public: "{prefix} <green>You joined <white>{name}</white>!</green>"

# Kick
faction-kicked: "{prefix} <red>You were kicked from <white>{faction}</white> by <white>{player}</white>.</red>"
